name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install system media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify
        run: npm run verify

      - name: Install browser test dependencies
        run: npx --no-install playwright install --with-deps chrome

      - name: Run browser tests
        run: npm run test:e2e

      - name: Validate Compose file
        run: docker compose config -q

      - name: Build container image
        run: docker compose build

      - name: Start container and check health
        run: |
          install -d -m 700 aether-data
          password_hash="$(printf '%s' 'aether-ci-password' | npm run --silent hash-password -w @aether/server -- --stdin)"
          {
            printf 'AETHER_PASSWORD_HASH=%s\n' "$password_hash"
            printf 'AETHER_SESSION_SECRET=%s\n' 'ci-only-session-secret-that-is-long-enough'
            printf 'AETHER_COOKIE_SECURE=false\n'
            printf 'AETHER_WATCH_ENABLED=false\n'
          } > aether-data/private.env
          chmod 600 aether-data/private.env

          export AETHER_UID="$(id -u)"
          export AETHER_GID="$(id -g)"
          cleanup() {
            status=$?
            trap - EXIT
            if [ "$status" -ne 0 ]; then
              docker compose ps
              docker compose logs
            fi
            docker compose down --volumes --remove-orphans
            exit "$status"
          }
          trap cleanup EXIT

          docker compose up --detach --no-build
          healthy=false
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:3030/api/health > /dev/null \
              && curl --fail --silent --show-error http://127.0.0.1:3030/ | grep --quiet '<div id="root">'; then
              healthy=true
              break
            fi
            sleep 2
          done
          test "$healthy" = true
