<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f7f7f8" />
    <title>Aether is offline</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        box-sizing: border-box;
        padding: max(24px, env(safe-area-inset-top))
          max(24px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom))
          max(24px, env(safe-area-inset-left));
      }
      main {
        max-width: 26rem;
      }
      h1 {
        font-size: 1.5rem;
      }
      p {
        line-height: 1.6;
      }
      button {
        min-height: 44px;
        padding: 0 20px;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Aether is offline</h1>
      <p>
        Connect to your Aether server to continue. Your saved location will be
        restored when the connection returns.
      </p>
      <button type="button" id="retry">Try again</button>
    </main>
    <script src="/offline-retry.js"></script>
  </body>
</html>
